relative select-none">
<!-- D1 Dashboard Background Simulation for authentic contextual backdrop -->
<div aria-hidden="true" class="w-full px-margin-mobile flex flex-col gap-space-md opacity-40 filter pointer-events-none aria-hidden">
<div class="flex justify-between items-center py-space-sm">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface-variant">שלום דניאל,</span>
<span class="font-headline-md text-headline-md text-primary">מוצרי החשמל שלך</span>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary font-headline-sm">
<span class="material-symbols-outlined text-primary">person</span>
</div>
</div>
<div class="bg-surface-container-lowest p-space-md rounded-xl flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<span class="font-headline-sm text-headline-sm text-primary">מקרר Samsung Family Hub</span>
<span class="bg-secondary-container/20 text-on-secondary-fixed-variant px-2 py-0.5 rounded text-badge-sm font-badge-sm">אחריות פעילה</span>
</div>
<span class="font-stat-counter text-stat-counter text-primary">24</span>
<span class="font-body-md text-body-md text-on-surface-variant">חודשים נותרו לאחריות יבואן רשמי</span>
</div>
<div class="bg-surface-container-lowest p-space-md rounded-xl flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<span class="font-headline-sm text-headline-sm text-primary">מכונת כביסה Bosch Serie 8</span>
<span class="bg-surface-variant text-on-surface-variant px-2 py-0.5 rounded text-badge-sm font-badge-sm">תפוגה בקרוב</span>
</div>
<span class="font-stat-counter text-stat-counter text-secondary">18</span>
<span class="font-body-md text-body-md text-on-surface-variant">ימים נותרו — מומלץ להאריך כיסוי</span>
</div>
</div>
<!-- Bottom Sheet Overlay with dark scrim rgba(18, 22, 51, 0.5) -->
<div class="fixed inset-0 z-40 bg-[#121633]/50 flex flex-col justify-end transition-opacity duration-300" id="action-sheet-backdrop">
<!-- Clickable dismiss area outside sheet -->
<div class="flex-1 w-full" onclick="closeSheet()"></div>
<!-- Sheet Container -->
<div class="w-full bg-surface-container-lowest rounded-t-[20px] px-margin-mobile pt-space-md pb-space-xl flex flex-col relative z-50 transform transition-transform duration-300 ease-out" id="action-sheet-surface">
<!-- Drag Handle Indicator -->
<div class="w-12 h-1 bg-surface-variant rounded-full mx-auto mb-space-md"></div>
<!-- Sheet Header -->
<div class="flex items-center justify-between pb-space-md">
<h2 class="font-headline-sm text-headline-sm text-primary font-bold">הוספת מכשיר</h2>
<button aria-label="סגירת תפריט" class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="closeSheet()" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Menu Options Stack -->
<div class="flex flex-col">
<!-- Row 1: צילום חשבונית -->
<button class="w-full py-space-md flex items-center justify-between text-right group hover:bg-surface-container-low/50 px-space-xs rounded-lg transition-colors focus:outline-none" onclick="selectAction('camera')" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center flex-shrink-0 text-primary group-hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-[26px] text-primary group-hover:text-on-secondary-fixed">photo_camera</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-body-bold text-body-bold text-primary">צילום חשבונית</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">נמלא את הפרטים בשבילכם</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[22px] transform transition-transform group-hover:-translate-x-1">arrow_back_ios</span>
</button>
<!-- Divider Line -->
<div class="w-full h-[1px] bg-surface-container"></div>
<!-- Row 2: העלאת קובץ PDF -->
<button class="w-full py-space-md flex items-center justify-between text-right group hover:bg-surface-container-low/50 px-space-xs rounded-lg transition-colors focus:outline-none" onclick="selectAction('pdf')" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center flex-shrink-0 text-primary group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[26px] text-primary group-hover:text-surface-container-lowest">picture_as_pdf</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-body-bold text-body-bold text-primary">העלאת קובץ PDF</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">חשבונית שקיבלתם במייל</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[22px] transform transition-transform group-hover:-translate-x-1">arrow_back_ios</span>
</button>
<!-- Divider Line -->
<div class="w-full h-[1px] bg-surface-container"></div>
<!-- Row 3: צילום התווית של המכשיר -->
<button class="w-full py-space-md flex items-center justify-between text-right group hover:bg-surface-container-low/50 px-space-xs rounded-lg transition-colors focus:outline-none" onclick="selectAction('label')" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center flex-shrink-0 text-primary group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[26px] text-primary group-hover:text-surface-container-lowest">barcode_scanner</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-body-bold text-body-bold text-primary">צילום התווית של המכשיר</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">כשאין חשבונית</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[22px] transform transition-transform group-hover:-translate-x-1">arrow_back_ios</span>
</button>
<!-- Divider Line -->
<div class="w-full h-[1px] bg-surface-container"></div>
<!-- Row 4: הזנה ידנית -->
<button class="w-full py-space-md flex items-center justify-between text-right group hover:bg-surface-container-low/50 px-space-xs rounded-lg transition-colors focus:outline-none" onclick="selectAction('manual')" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center flex-shrink-0 text-primary group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[26px] text-primary group-hover:text-surface-container-lowest">edit_square</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-body-bold text-body-bold text-primary">הזנה ידנית</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">ממלאים את הפרטים בעצמכם</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[22px] transform transition-transform group-hover:-translate-x-1">arrow_back_ios</span>
</button>
</div>
<!-- Quota Counter and Progress Section -->
<div class="mt-space-lg mb-space-lg bg-surface-container-low p-space-md rounded-xl flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface-variant">נותרו לכם 2 מתוך 5 סריקות החודש</span>
<span class="font-badge-sm text-badge-sm font-bold text-primary">חודשי</span>
</div>
<!-- 5-segment bar: 3 segments filled (#1B2559), 2 empty (#DCE0EA) -->
<div class="flex items-center gap-1.5 w-full pt-space-xs">
<!-- Segment 1 (Used) -->
<div class="h-1.5 flex-1 bg-primary-container rounded-full"></div>
<!-- Segment 2 (Used) -->
<div class="h-1.5 flex-1 bg-primary-container rounded-full"></div>
<!-- Segment 3 (Used) -->
<div class="h-1.5 flex-1 bg-primary-container rounded-full"></div>
<!-- Segment 4 (Remaining) -->
<div class="h-1.5 flex-1 bg-surface-variant rounded-full"></div>
<!-- Segment 5 (Remaining) -->
<div class="h-1.5 flex-1 bg-surface-variant rounded-full"></div>
</div>
</div>
<!-- Secondary Close Button -->
<button class="w-full h-12 bg-surface-container text-primary font-body-bold text-body-bold rounded-lg flex items-center justify-center hover:bg-surface-container-high active:bg-surface-variant transition-colors focus:outline-none" onclick="closeSheet()" type="button">
        סגירה
      </button>
</div>
</div>
</div>
<script>
  function closeSheet() {
    const sheetBackdrop = document.getElementById('action-sheet-backdrop');
    const sheetSurface = document.getElementById('action-sheet-surface');
    if (sheetSurface && sheetBackdrop) {
      sheetSurface.style.transform = 'translateY(100%)';
      sheetBackdrop.style.opacity = '0';
      setTimeout(() => {
        sheetBackdrop.style.display = 'none';
      }, 300);
    }
  }

  function selectAction(type) {
    const feedback = {
      camera: 'פותח צילום חשבונית...',
      pdf: 'פותח סייר קבצים ל-PDF...',
      label: 'פותח סורק תוויות וברקוד...',
      manual: 'מעביר להזנה ידנית...'
    };
    console.log(feedback[type] || type);
    closeSheet();
  }
</script></main></body></html>
