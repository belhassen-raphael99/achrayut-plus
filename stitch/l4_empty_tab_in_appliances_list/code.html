<script>

    const returnBtn = document.getElementById('return-all-btn');
    if (returnBtn) {
      returnBtn.addEventListener('click', function () {
        const tabs = document.querySelectorAll('[role="tab"]');
        if (tabs && tabs.length > 0) {
          tabs[0].click();
        }
      });
    }
  })();
