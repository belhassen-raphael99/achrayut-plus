<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A7 — Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            night: '#1B2559',
            saffron: '#F4B942',
            ink: '#121633',
            porcelain: '#EEF0F6',
            danger: '#C7372A',
            muted: '#4A4F66',
            subtle: '#8A8F9E',
            lightborder: '#D8DAE0'
          },
          fontFamily: {
            sans: ['Assistant', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Assistant', sans-serif; background-color: #EEF0F6; color: #121633; margin: 0; padding: 0; }
    .ltr-input { direction: ltr; text-align: left; }
  </style>
</head>
<body class="bg-porcelain min-h-screen flex flex-col items-center">
  <div class="w-full max-w-[375px] min-h-screen bg-porcelain flex flex-col relative pb-10">
    
    <!-- AUTH LAYOUT TOP BAND -->
    <div class="bg-night h-[160px] w-full px-5 pt-8 flex items-start justify-between relative">
      <button class="text-white hover:opacity-80 transition p-1" aria-label="חזרה">
        <svg class="w-6 h-6 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <div class="flex items-center gap-2">
        <span class="text-white font-bold text-xl tracking-tight">תו אחריות</span>
        <span class="w-2.5 h-2.5 bg-saffron rounded-sm inline-block"></span>
      </div>
    </div>

    <!-- MAIN AUTH CARD overlapping band by 30px -->
    <div class="px-4 -mt-[30px] w-full z-10">
      <div class="bg-white rounded-[16px] p-6 w-full border border-lightborder shadow-none">
        
        <h1 class="text-[26px] font-bold text-ink mb-5 text-center">הרשמה</h1>

        <!-- Google button -->
        <button class="w-full bg-white border-[1.5px] border-subtle rounded-[10px] py-3 px-4 flex items-center justify-center gap-3 text-ink font-semibold text-[16px] hover:bg-gray-50 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>המשך עם Google</span>
        </button>

        <!-- Divider with "או" -->
        <div class="relative flex py-4 items-center">
          <div class="flex-grow border-t border-lightborder"></div>
          <span class="flex-shrink mx-4 text-[14px] text-muted font-medium">או</span>
          <div class="flex-grow border-t border-lightborder"></div>
        </div>

        <!-- Form fields -->
        <div class="space-y-4">
          <!-- Two fields side by side: שם פרטי, שם משפחה -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[14px] font-semibold text-ink mb-1.5">שם פרטי</label>
              <input type="text" value="נועה" class="w-full bg-white border border-lightborder rounded-[10px] p-3 text-[16px] text-ink focus:outline-none focus:border-night">
            </div>
            <div>
              <label class="block text-[14px] font-semibold text-ink mb-1.5">שם משפחה</label>
              <input type="text" value="לוי" class="w-full bg-white border border-lightborder rounded-[10px] p-3 text-[16px] text-ink focus:outline-none focus:border-night">
            </div>
          </div>

          <div>
            <label class="block text-[14px] font-semibold text-ink mb-1.5">אימייל</label>
            <input type="email" value="noa@example.com" class="w-full bg-white border border-lightborder rounded-[10px] p-3 text-[16px] text-ink ltr-input focus:outline-none focus:border-night">
          </div>

          <div>
            <label class="block text-[14px] font-semibold text-ink mb-1.5">סיסמה</label>
            <div class="relative flex items-center">
              <input type="password" value="••••••••" class="w-full bg-white border border-lightborder rounded-[10px] p-3 pl-11 text-[16px] text-ink ltr-input focus:outline-none focus:border-night">
              <button type="button" class="absolute left-3 text-muted hover:text-ink" aria-label="הצג סיסמה">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
            <span class="block text-[13px] text-muted mt-1.5 font-normal">לפחות 8 תווים</span>
          </div>

          <!-- Required checkbox -->
          <div class="pt-1">
            <label class="flex items-start gap-2.5 cursor-pointer select-none">
              <input type="checkbox" checked class="mt-1 w-4 h-4 text-night rounded border-lightborder focus:ring-0">
              <span class="text-[14px] text-ink leading-snug">
                מסכימ/ה ל<a href="#" class="text-night underline font-semibold">תנאי השימוש</a> ול<a href="#" class="text-night underline font-semibold">מדיניות הפרטיות</a>
              </span>
            </label>
          </div>

          <!-- Primary button -->
          <div class="pt-3">
            <button class="w-full bg-saffron hover:bg-amber-400 text-ink font-bold text-[16px] py-3.5 px-4 rounded-[10px] transition">
              יצירת חשבון
            </button>
          </div>
        </div>

      </div>

      <!-- Below card link -->
      <div class="text-center mt-6">
        <p class="text-[15px] text-ink">
          כבר יש לכם חשבון? 
          <a href="#" class="font-bold text-night underline mr-1 hover:opacity-80">התחברות</a>
        </p>
      </div>

    </div>

  </div>
</body>
</html>
