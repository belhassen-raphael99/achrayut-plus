safe bg-primary-container text-on-primary"><div class="h-20 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><img alt="Hebrew warranty brand mark with clean typography and saffron geometric square accent. Brand logo. - Primary color: #1b2559
- Font: publicSans
- Mode: light
- Roundness: rounded-sm
" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1UJEXB2W0eXcR0uLrjPhebHA-zd-5tQE7o8TlfCucXoJAApxG51kiDBpVGhq64fsFFkRX40wymx9zb4rpIEfXGmmPnkDBsEzISxBrNs9VW_lS4r12n3KQ_iEnVGzPkxtTRnjnzsFdilfx1ZNUeC4Pq3OMNR7tDUkXMEkkxr56WZCnVFgc36sld4UStXq0sgB_sk7Hh-z_mOe4LyT4zEe4lu22OgM4hjsMcH7Tk_uKKhPtxNG3icYrDRwZ8"/><div class="flex flex-col"><span class="font-headline-sm text-headline-sm text-on-primary leading-none">תו אחריות</span><span class="font-label-md text-label-md text-on-primary-container leading-none pt-space-xs">Login</span></div></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div><button aria-label="חזרה" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-primary hover:bg-white/10 active:bg-white/20 transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button></div></div></header><main class="flex-1 flex flex-col relative w-full pt-20 bg-surface-container"><div class="flex flex-col w-full selection:bg-secondary-container">
<!-- Top Branded Band -->
<div class="w-full bg-primary-container h-40 px-margin-mobile flex flex-col justify-start pt-space-md">
<div class="flex items-center justify-between w-full">
<!-- Back Action -->
<button aria-label="חזרה" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-primary active:bg-white/10 transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
<!-- Brand Mark & Saffron Accent -->
<div class="flex items-center gap-space-xs">
<div class="w-2.5 h-2.5 bg-secondary-container rounded-xs"></div>
<span class="font-headline-sm text-headline-sm text-on-primary tracking-wide">תו אחריות</span>
</div>
<!-- Balance Spacer -->
<div class="w-11 h-11"></div>
</div>
</div>
<!-- Primary Foreground Content Area (Porcelain background) -->
<div class="w-full px-margin-mobile -mt-8 pb-space-2xl flex flex-col items-center">
<!-- Elevated Card with Pure Crisp Tone & Anti-Nesting Geometry -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-full p-space-lg flex flex-col items-center text-center shadow-md">
<!-- Lock Visual Container -->
<div class="relative w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center mb-space-lg">
<div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<!-- Status Indicator Dot -->
<div class="absolute top-1 left-1 w-4 h-4 rounded-full bg-secondary-container ring-2 ring-surface-container-lowest"></div>
</div>
<!-- Card Typography Section -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-space-sm">
        החשבון הזה מושבת
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs leading-relaxed mb-space-xl">
        אי אפשר להתחבר לחשבון כרגע. אם לדעתכם זו טעות, כתבו לנו ונבדוק.
      </p>
<!-- Primary Action CTA -->
<a class="w-full h-12 bg-secondary-container text-on-secondary-container font-body-bold text-body-bold rounded-lg flex items-center justify-center gap-space-xs active:opacity-90 transition-transform active:scale-[0.99]" href="#contact" id="contact-btn">
<span class="material-symbols-outlined text-[20px]">support_agent</span>
<span>יצירת קשר</span>
</a>
<!-- Quick Feedback Message Panel (Revealed on Click) -->
<div class="hidden w-full mt-space-md pt-space-md border-t border-surface-variant text-right" id="contact-drawer">
<p class="font-label-md text-label-md text-on-surface mb-space-xs">שלחו פנייה מזורזת לתמיכה:</p>
<div class="flex flex-col gap-space-xs">
<input class="w-full h-10 px-space-sm bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container" dir="rtl" placeholder="דוא״ל לחזרה" type="email"/>
<button class="h-10 bg-primary-container text-on-primary font-label-md text-label-md rounded-lg mt-space-xs active:bg-primary" onclick="handleQuickSubmit()" type="button">
            שליחה למוקד
          </button>
</div>
</div>
</div>
<!-- Below Card Navigation Link -->
<div class="mt-space-xl flex flex-col items-center gap-space-sm">
<a class="font-label-md text-label-md text-primary-container hover:underline flex items-center gap-space-xs py-space-xs px-space-sm rounded-lg active:bg-surface-variant/40 transition-colors" href="/">
<span>חזרה לדף הבית</span>
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
</a>
<!-- Operational Trust Badge -->
<div class="flex items-center gap-space-xs text-outline pt-space-xs">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-badge-sm text-badge-sm">מוקד שירות וסיוע פעיל 24/7</span>
</div>
</div>
</div>
</div>
<script>
  const contactBtn = document.getElementById('contact-btn');
  const contactDrawer = document.getElementById('contact-drawer');

  if (contactBtn && contactDrawer) {
    contactBtn.addEventListener('click', function(e) {
      e.preventDefault();
      contactDrawer.classList.toggle('hidden');
    });
  }

  function handleQuickSubmit() {
    if (contactDrawer) {
      contactDrawer.innerHTML = `
        <div class="p-space-sm bg-surface-container-low rounded-lg text-center">
          <span class="material-symbols-outlined text-primary text-[24px]">check_circle</span>
          <p class="font-label-md text-label-md text-on-surface mt-space-xs">הפנייה התקבלה! נחזור אליכם תוך שעתיים.</p>
        </div>
      `;
    }
  }
</script></main></body></html>
