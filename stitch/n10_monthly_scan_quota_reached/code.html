 z-40 bg-[#121633]/50 pointer-events-auto transition-opacity"></div><main class="fixed bottom-0 inset-x-0 z-50 max-h-[90vh] flex flex-col bg-surface-container-lowest rounded-t-[20px] shadow-[0_-4px_24px_rgba(18,22,51,0.16)] pb-safe overflow-hidden"><div class="w-full flex items-center justify-center pt-3 pb-1"><div class="w-12 h-1 rounded-full bg-outline-variant"></div></div><div class="flex items-center justify-between px-gutter-mobile py-space-sm"><h2 class="font-headline-sm text-headline-sm text-primary">Add Appliance Sheet</h2><button aria-label="סגור" class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined">close</span></button></div><div class="flex-1 overflow-y-auto px-gutter-mobile pb-space-lg bg-surface-container-lowest"><div class="flex flex-col w-full px-space-xs pb-space-md text-right" dir="rtl">
