<!DOCTYPE html>

<html dir="rtl" lang="he"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f7f9ff;}body{overscroll-behavior:none;font-family:'Assistant',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'on-tertiary-container': '#858fba', 'on-secondary-fixed-variant': '#5e4200', 'on-secondary': '#ffffff', 'on-surface-variant': '#45464f', 'surface-container-lowest': '#ffffff', 'error': '#ba1a1a', 'on-error': '#ffffff', 'surface-container-low': '#f1f3f9', 'inverse-primary': '#bac3ff', 'secondary-fixed-dim': '#f8bd45', 'tertiary-fixed': '#dce1ff', 'secondary-container': '#fec24a', 'on-secondary-fixed': '#271900', 'background': '#f7f9ff', 'surface': '#f7f9ff', 'inverse-surface': '#2d3135', 'on-error-container': '#93000a', 'primary-container': '#1b2559', 'on-primary-container': '#848dc8', 'primary': '#030e44', 'surface-container': '#eceef4', 'inverse-on-surface': '#eff1f7', 'surface-bright': '#f7f9ff', 'on-primary': '#ffffff', 'on-secondary-container': '#715000', 'on-background': '#181c20', 'surface-variant': '#e0e2e8', 'outline-variant': '#c6c5d1', 'on-tertiary-fixed-variant': '#3b456b', 'on-tertiary-fixed': '#0e193d', 'surface-container-high': '#e6e8ee', 'tertiary-fixed-dim': '#bbc5f2', 'on-tertiary': '#ffffff', 'on-primary-fixed-variant': '#394378', 'primary-fixed-dim': '#bac3ff', 'surface-tint': '#515b92', 'on-primary-fixed': '#0b164a', 'tertiary': '#071337', 'primary-fixed': '#dee0ff', 'on-surface': '#181c20', 'secondary': '#7c5800', 'outline': '#767680', 'error-container': '#ffdad6', 'secondary-fixed': '#ffdea7', 'tertiary-container': '#1d284d', 'surface-container-highest': '#e0e2e8', 'surface-dim': '#d8dae0' }, borderRadius: { 'DEFAULT': '0.125rem', 'lg': '0.25rem', 'xl': '0.5rem', 'full': '0.75rem' }, spacing: { 'space-sm': '0.5rem', 'space-lg': '1.5rem', 'space-xl': '2.5rem', 'margin-mobile': '1rem', 'space-xs': '0.25rem', 'margin': '2.5rem', 'space-md': '1rem', 'gutter-mobile': '1rem', 'space-2xl': '4rem', 'gutter': '1.5rem' }, fontFamily: { 'body-lg': ['Assistant'], 'headline-sm': ['Assistant'], 'label-md': ['Assistant'], 'stat-counter': ['Assistant'], 'headline-md': ['Assistant'], 'headline-lg-mobile': ['Assistant'], 'display-hero': ['Assistant'], 'badge-sm': ['Assistant'], 'body-md': ['Assistant'], 'body-bold': ['Assistant'], 'headline-lg': ['Assistant'], 'display-hero-mobile': ['Assistant'] }, fontSize: { 'body-lg': ['18px', { lineHeight: '28px', fontWeight: '400' }], 'headline-sm': ['20px', { lineHeight: '28px', fontWeight: '600' }], 'label-md': ['14px', { lineHeight: '20px', fontWeight: '600' }], 'stat-counter': ['44px', { lineHeight: '48px', letterSpacing: '0em', fontWeight: '200' }], 'headline-md': ['24px', { lineHeight: '32px', fontWeight: '700' }], 'headline-lg-mobile': ['26px', { lineHeight: '32px', letterSpacing: '-0.01em', fontWeight: '700' }], 'display-hero': ['56px', { lineHeight: '64px', letterSpacing: '-0.02em', fontWeight: '200' }], 'badge-sm': ['13px', { lineHeight: '16px', fontWeight: '600' }], 'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }], 'body-bold': ['16px', { lineHeight: '24px', fontWeight: '700' }], 'headline-lg': ['32px', { lineHeight: '40px', letterSpacing: '-0.01em', fontWeight: '700' }], 'display-hero-mobile': ['40px', { lineHeight: '48px', letterSpacing: '-0.01em', fontWeight: '200' }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full relative select-none overflow-hidden" dir="rtl">
<!-- Immersive Live Camera Viewport -->
<div class="relative w-full aspect-[9/16] max-h-[820px] bg-primary flex flex-col justify-between overflow-hidden shadow-2xl rounded-full">
<!-- Camera Sensor Stream (Kitchen counter with physical appliance invoice) -->
<img class="absolute inset-0 w-full h-full object-cover" data-alt="Top down overhead photograph of a crisp paper retail receipt and printed appliance warranty invoice lying flat on a natural bright oak wooden kitchen countertop. Clean Scandinavian domestic aesthetic, warm directional morning sunlight streaming across without harsh shadows, soft neutral tones with subtle reflections of stainless steel home hardware nearby." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-yXu_KMG_bqHM2Yj7rbTJb_LjzJ7qagB487-DCpmmx-ZImpi_xT8GH4mQLlfNNlLCJLB-i2QH3DlNpdC18P7CUp8Uo7GypWbe3EtdM1USiE5_VdT9I5fK0Q0xXfOU_n4nh1bOuNJKrqLmhipGBQY8w54pro-dGHDyPwe53UEWxPHbGiGXml7nPypS4CWIlzXN1ErSq63kBbQvGC4JEUIQG9b8JCNxe96AfbRxrt2TXm3i3UWnp-EF"/>
<!-- Ambient Camera Glass Tint and Edge Contrast Scrim -->
<div class="absolute inset-0 bg-primary/20 pointer-events-none"></div>
<!-- Top Floating Header Controls -->
<div class="relative z-10 flex items-center justify-between p-space-md pt-space-lg">
<!-- Close Exit Button (RTL Forward Dismissal on Left/Right) -->
<button aria-label="סגירה וחזרה" class="w-12 h-12 rounded-full bg-primary-container/80 text-on-primary flex items-center justify-center transition-transform active:scale-95 cursor-pointer" id="btn-close">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Auto Detect Scanner Chip -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary-container/80 text-on-primary">
<span class="w-2 h-2 rounded-full bg-secondary-container animate-pulse"></span>
<span class="font-label-md text-label-md text-on-primary tracking-wide">זיהוי אוטומטי פעיל</span>
</div>
<!-- Aspect Ratio / Grid Guide Toggle -->
<button aria-label="הפעלת רשת יישור" class="w-12 h-12 rounded-full bg-primary-container/80 text-on-primary flex items-center justify-center transition-transform active:scale-95 cursor-pointer" id="btn-grid">
<span class="material-symbols-outlined text-[22px]">grid_on</span>
</button>
</div>
<!-- Central Viewfinder Reticle & Adaptive Guidance Labels -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-space-md my-auto">
<!-- Top Instruction Pill Badge -->
<div class="mb-4 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-primary text-on-primary shadow-sm transition-all duration-300 transform">
<span class="material-symbols-outlined text-[16px] text-secondary-container">document_scanner</span>
<span class="font-label-md text-label-md text-on-primary">יישרו את החשבונית בתוך המסגרת</span>
</div>
<!-- Reticle Box with Precise Corner Brackets -->
<div class="relative w-full max-w-[310px] aspect-[1/1.42] flex items-center justify-center transition-transform duration-300" id="scanner-frame">
<!-- Live Scanning Optical Sweep Line -->
<div class="absolute inset-x-3 top-0 h-0.5 bg-secondary-container opacity-85 shadow-sm animate-[bounce_3.2s_ease-in-out_infinite]"></div>
<!-- Four Structural Precision Corners (RTL Balanced) -->
<!-- Top Right Corner -->
<div class="absolute top-0 right-0 w-8 h-8 flex flex-col items-end">
<div class="w-full h-1 bg-surface-container-lowest rounded-t-DEFAULT"></div>
<div class="w-1 h-7 bg-surface-container-lowest"></div>
</div>
<!-- Top Left Corner -->
<div class="absolute top-0 left-0 w-8 h-8 flex flex-col items-start">
<div class="w-full h-1 bg-surface-container-lowest rounded-t-DEFAULT"></div>
<div class="w-1 h-7 bg-surface-container-lowest"></div>
</div>
<!-- Bottom Right Corner -->
<div class="absolute bottom-0 right-0 w-8 h-8 flex flex-col items-end justify-end">
<div class="w-1 h-7 bg-surface-container-lowest"></div>
<div class="w-full h-1 bg-surface-container-lowest rounded-b-DEFAULT"></div>
</div>
<!-- Bottom Left Corner -->
<div class="absolute bottom-0 left-0 w-8 h-8 flex flex-col items-start justify-end">
<div class="w-1 h-7 bg-surface-container-lowest"></div>
<div class="w-full h-1 bg-surface-container-lowest rounded-b-DEFAULT"></div>
</div>
<!-- Subtle Crosshair Central Reference -->
<div class="w-6 h-6 flex items-center justify-center opacity-30 pointer-events-none">
<div class="w-full h-0.5 bg-surface-container-lowest"></div>
<div class="h-full w-0.5 bg-surface-container-lowest absolute"></div>
</div>
</div>
<!-- Bottom Status Pill Badge -->
<div class="mt-4 inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-primary text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[16px] text-secondary-fixed-dim">wb_sunny</span>
<span class="font-label-md text-label-md text-on-primary">אור טוב, בלי צל</span>
</div>
</div>
<!-- Bottom Controls & Shutter Deck -->
<div class="relative z-10 w-full bg-primary/90 px-space-md pt- space-md pb-space-xl flex flex-col items-center gap-space-md">
<!-- Guidance Quick Tip -->
<div class="flex items-center gap-1 text-on-tertiary-container">
<span class="material-symbols-outlined text-[15px]">info</span>
<span class="font-badge-sm text-badge-sm">הקפידו שפרטי הספק, התאריך והסכום קריאים</span>
</div>
<!-- Primary Action Row -->
<div class="w-full max-w-xs flex items-center justify-between px-space-sm">
<!-- Upload Document Side Button -->
<button aria-label="העלאת קובץ מגלריה או PDF" class="flex flex-col items-center justify-center gap-1 text-on-primary group cursor-pointer transition-transform active:scale-95" id="btn-upload">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary transition-colors group-hover:bg-on-tertiary-fixed-variant">
<span class="material-symbols-outlined text-[24px]">upload_file</span>
</div>
<span class="font-badge-sm text-badge-sm text-on-primary">העלאת קובץ</span>
</button>
<!-- Center Shutter Trigger (Double White Ring Architectural Frame) -->
<div class="relative flex items-center justify-center">
<button aria-label="לכידת צילום חשבונית" class="relative w-20 h-20 rounded-full p-1 bg-surface-container-lowest flex items-center justify-center shadow-lg transition-transform active:scale-90 cursor-pointer focus:outline-none" id="btn-shutter">
<!-- Inner Concentric Tactile Core -->
<div class="w-full h-full rounded-full bg-surface-container-lowest flex items-center justify-center">
<div class="w-16 h-16 rounded-full bg-primary transition-transform duration-150" id="shutter-core"></div>
</div>
</button>
</div>
<!-- Flash / Torch Toggle Button -->
<button aria-label="הפעלת מבזק תאורה" class="flex flex-col items-center justify-center gap-1 text-on-primary group cursor-pointer transition-transform active:scale-95" id="btn-flash">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary transition-colors" id="flash-icon-bg">
<span class="material-symbols-outlined text-[24px]" id="flash-icon">flash_off</span>
</div>
<span class="font-badge-sm text-badge-sm text-on-primary" id="flash-text">מבזק כבוי</span>
</button>
</div>
</div>
<!-- Haptic Confirmation Flash Animation Overlay -->
<div class="absolute inset-0 bg-surface-container-lowest pointer-events-none opacity-0 transition-opacity duration-150 z-50" id="shutter-flash-overlay"></div>
</div>
<input accept="image/*,.pdf" class="hidden" id="file-picker-input" type="file"/>
</div>
<script>
  (function() {
    const shutterBtn = document.getElementById('btn-shutter');
    const flashBtn = document.getElementById('btn-flash');
    const flashIcon = document.getElementById('flash-icon');
    const flashIconBg = document.getElementById('flash-icon-bg');
    const flashText = document.getElementById('flash-text');
    const uploadBtn = document.getElementById('btn-upload');
    const fileInput = document.getElementById('file-picker-input');
    const flashOverlay = document.getElementById('shutter-flash-overlay');
    const scannerFrame = document.getElementById('scanner-frame');
    const shutterCore = document.getElementById('shutter-core');

    let isFlashOn = false;

    // Flash Toggle Interaction
    flashBtn.addEventListener('click', () => {
      isFlashOn = !isFlashOn;
      if (isFlashOn) {
        flashIcon.textContent = 'flash_on';
        flashIcon.style.fontVariationSettings = "'FILL' 1";
        flashIconBg.classList.remove('bg-primary-container');
        flashIconBg.classList.add('bg-secondary-container', 'text-on-secondary-fixed');
        flashText.textContent = 'מבזק פעיל';
      } else {
        flashIcon.textContent = 'flash_off';
        flashIcon.style.fontVariationSettings = "'FILL' 0";
        flashIconBg.classList.remove('bg-secondary-container', 'text-on-secondary-fixed');
        flashIconBg.classList.add('bg-primary-container', 'text-on-primary');
        flashText.textContent = 'מבזק כבוי';
      }
    });

    // Capture Interaction & Haptic Flash
    shutterBtn.addEventListener('click', () => {
      shutterCore.classList.add('scale-75', 'bg-secondary-container');
      flashOverlay.classList.remove('opacity-0');
      flashOverlay.classList.add('opacity-80');

      if (scannerFrame) {
        scannerFrame.classList.add('scale-95');
      }

      setTimeout(() => {
        flashOverlay.classList.remove('opacity-80');
        flashOverlay.classList.add('opacity-0');
        shutterCore.classList.remove('scale-75', 'bg-secondary-container');
        if (scannerFrame) {
          scannerFrame.classList.remove('scale-95');
        }
      }, 180);
    });

    // File Picker Trigger
    uploadBtn.addEventListener('click', () => {
      fileInput.click();
    });
  })();
</script></main></body></html>
