<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>

</div>
<!-- Content Card Overlapping Top Band -->
<div class="px-margin-mobile -mt-[30px] z-10">
<div class="bg-surface-container-lowest rounded-full p-space-lg flex flex-col">
<!-- Card Title -->
<h1 class="font-headline-md text-headline-md text-on-background text-right mb-space-lg">התחברות</h1>
<!-- Google Authentication Button -->
<button class="w-full h-12 bg-surface-container-lowest rounded-lg flex items-center justify-center gap-space-sm px-space-md hover:bg-surface-container-low transition-colors outline outline-outline-variant" type="button">
<svg class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-body-bold text-body-bold text-on-surface">המשך עם Google</span>
</button>
<!-- Divider -->
<div class="relative flex py-space-lg items-center">
<div class="flex-grow bg-surface-variant h-[1px]"></div>
<span class="flex-shrink mx-space-md font-body-md text-body-md text-on-surface-variant">או</span>
<div class="flex-grow bg-surface-variant h-[1px]"></div>
</div>
<!-- Form Inputs -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface text-right" for="email-input">אימייל</label>
<input class="w-full h-12 px-space-md bg-surface-container-lowest text-on-surface font-body-md text-body-md text-left rounded-lg outline outline-surface-dim focus:outline-primary-container" dir="ltr" id="email-input" type="email" value="noa@example.com"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface text-right" for="password-input">סיסמה</label>
<div class="relative flex items-center">
<input class="w-full h-12 pr-space-md pl-12 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg outline outline-surface-dim focus:outline-primary-container" id="password-input" placeholder="••••••••" type="password"/>
<button aria-label="הצג או הסתר סיסמה" class="absolute left-0 h-12 w-12 flex items-center justify-center text-on-surface-variant hover:text-on-surface" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-icon">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-start pt-space-xs">
<a class="font-label-md text-label-md text-primary-container underline hover:opacity-80" href="#">שכחתי סיסמה</a>
</div>
</div>
<!-- Primary Filled Login Button -->
<div class="pt-space-xs">
<button class="w-full h-12 bg-secondary-container text-on-secondary-container font-body-bold text-body-bold rounded-lg flex items-center justify-center hover:bg-secondary-fixed transition-colors" type="submit">
            התחברות
          </button>
</div>
</form>
</div>
</div>
<!-- Registration Link Section Below Card -->
<div class="w-full py-space-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      אין לכם חשבון? 
      <a class="text-primary-container font-body-bold text-body-bold underline hover:opacity-80" href="#">הרשמה</a>
</p>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-password-btn');
    const passwordIcon = document.getElementById('password-icon');

    if (toggleBtn && passwordInput && passwordIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
