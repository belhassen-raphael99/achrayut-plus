<!-- Interactive Form Area -->
<section class="px-gutter-mobile py-space-md flex flex-col gap-space-lg">
<!-- Header Block -->
<div class="flex flex-col gap-space-xs">
<div class="inline-flex items-center gap-space-xs px-space-sm py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed w-fit font-badge-sm text-badge-sm mb-1">
<span class="material-symbols-outlined text-[16px]">receipt_long</span>
<span>זיהוי אוטומטי מהחשבונית</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-tertiary">מצאנו כמה מכשירים בחשבונית</h2>
<p class="font-body-md text-body-md text-on-surface-variant">בחרו את המכשיר שתרצו להוסיף עכשיו. את השאר אפשר להוסיף אחר כך.</p>
</div>
<!-- Appliance Radio Selection Container -->
<div aria-label="בחירת מכשיר להוספה" class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm flex flex-col" id="appliance-selector" role="radiogroup">
<!-- Row 1: Selected Item -->
<label class="appliance-option relative flex items-center justify-between p-space-md bg-surface-container transition-colors cursor-pointer select-none" data-id="1">
<input checked="" class="sr-only" name="selected_device" type="radio" value="refrigerator"/>
<div class="flex items-center gap-space-md min-w-0">
<div class="radio-indicator w-5 h-5 rounded-full bg-primary flex items-center justify-center flex-shrink-0">
<div class="w-2 h-2 rounded-full bg-surface-container-lowest"></div>
</div>
<div class="flex flex-col min-w-0">
<span class="font-body-bold text-body-bold text-tertiary truncate">מקרר סמסונג RB38 · 3,490 ₪</span>
<span class="font-label-md text-label-md text-on-surface-variant">מטבח · כולל אחריות יבואן רשמי (שנה)</span>
</div>
</div>
<span class="material-symbols-outlined text-primary text-[22px] flex-shrink-0 mr-2">kitchen</span>
</label>
<!-- Hairline Division -->
<div class="h-[1px] w-full bg-surface-container-highest"></div>
<!-- Row 2: Unchecked Item -->
<label class="appliance-option relative flex items-center justify-between p-space-md bg-surface-container-lowest hover:bg-surface-container-low transition-colors cursor-pointer select-none" data-id="2">
<input class="sr-only" name="selected_device" type="radio" value="microwave"/>
<div class="flex items-center gap-space-md min-w-0">
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-container-highest flex items-center justify-center flex-shrink-0">
<div class="w-2 h-2 rounded-full bg-transparent"></div>
</div>
<div class="flex flex-col min-w-0">
<span class="font-body-md text-body-md text-tertiary truncate">מיקרוגל LG MS23 · 590 ₪</span>
<span class="font-label-md text-label-md text-on-surface-variant">מטבח · אחריות יבואן (שנתיים)</span>
</div>
</div>
<span class="material-symbols-outlined text-outline text-[22px] flex-shrink-0 mr-2">microwave</span>
</label>
<!-- Hairline Division -->
<div class="h-[1px] w-full bg-surface-container-highest"></div>
<!-- Row 3: Unchecked Item -->
<label class="appliance-option relative flex items-center justify-between p-space-md bg-surface-container-lowest hover:bg-surface-container-low transition-colors cursor-pointer select-none" data-id="3">
<input class="sr-only" name="selected_device" type="radio" value="vacuum"/>
<div class="flex items-center gap-space-md min-w-0">
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-container-highest flex items-center justify-center flex-shrink-0">
<div class="w-2 h-2 rounded-full bg-transparent"></div>
</div>
<div class="flex flex-col min-w-0">
<span class="font-body-md text-body-md text-tertiary truncate">שואב אבק דייסון V12 · 2,290 ₪</span>
<span class="font-label-md text-label-md text-on-surface-variant">ניקיון הבית · אחריות יבואן (שנתיים)</span>
</div>
</div>
<span class="material-symbols-outlined text-outline text-[22px] flex-shrink-0 mr-2">cleaning_services</span>
</label>
</div>
<!-- Micro-reassurance Card -->
<div class="flex items-center gap-space-sm p-space-md rounded-lg bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-secondary text-[20px] flex-shrink-0">info</span>
<p class="font-label-md text-label-md leading-normal">החשבונית נשמרת אוטומטית בכרטיס המכשיר ותהיה זמינה בכל עת לפתיחת קריאת שירות.</p>
</div>
</section>
<!-- Sticky Bottom CTA Area -->
<div class="mt-auto p-gutter-mobile bg-surface/95 backdrop-blur-sm sticky bottom-0 z-20">
<button class="w-full h-12 bg-secondary-container hover:bg-secondary-fixed-dim active:opacity-90 text-on-secondary-fixed font-body-bold text-body-bold rounded-lg flex items-center justify-center gap-space-xs shadow-sm transition-all" id="submit-btn" type="button">
<span>המשך לבדיקה</span>
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
</div>
</div>
<script>
  (function() {
    const options = document.querySelectorAll('.appliance-option');
    options.forEach(option => {
      const input = option.querySelector('input[type="radio"]');
      option.addEventListener('click', () => {
        options.forEach(opt => {
          const optInput = opt.querySelector('input[type="radio"]');
          const indicator = opt.querySelector('.radio-indicator');
          const dot = indicator ? indicator.querySelector('div') : null;
          const textSpan = opt.querySelector('span.truncate');
          const iconSpan = opt.querySelector('.material-symbols-outlined:last-child');

          opt.classList.remove('bg-surface-container');
          opt.classList.add('bg-surface-container-lowest');
          
          if (indicator) {
            indicator.classList.remove('bg-primary');
            indicator.classList.add('bg-surface-container-highest');
          }
          if (dot) {
            dot.classList.remove('bg-surface-container-lowest');
            dot.classList.add('bg-transparent');
          }
          if (textSpan) {
            textSpan.classList.remove('font-body-bold');
            textSpan.classList.add('font-body-md');
          }
          if (iconSpan) {
            iconSpan.classList.remove('text-primary');
            iconSpan.classList.add('text-outline');
          }
          optInput.checked = false;
        });

        // Activate clicked item
        input.checked = true;
        option.classList.remove('bg-surface-container-lowest');
        option.classList.add('bg-surface-container');

        const activeIndicator = option.querySelector('.radio-indicator');
        const activeDot = activeIndicator ? activeIndicator.querySelector('div') : null;
        const activeTextSpan = option.querySelector('span.truncate');
        const activeIconSpan = option.querySelector('.material-symbols-outlined:last-child');

        if (activeIndicator) {
          activeIndicator.classList.remove('bg-surface-container-highest');
          activeIndicator.classList.add('bg-primary');
        }
        if (activeDot) {
          activeDot.classList.remove('bg-transparent');
          activeDot.classList.add('bg-surface-container-lowest');
        }
        if (activeTextSpan) {
          activeTextSpan.classList.remove('font-body-md');
          activeTextSpan.classList.add('font-body-bold');
        }
        if (activeIconSpan) {
          activeIconSpan.classList.remove('text-outline');
          activeIconSpan.classList.add('text-primary');
        }
      });
    });
  })();
</script></main></body></html>
