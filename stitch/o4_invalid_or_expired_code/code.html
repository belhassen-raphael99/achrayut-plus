": "#858fba", "tertiary-fixed-dim": "#bbc5f2", "primary": "#030e44", "error": "#ba1a1a" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-2xl": "4rem", "margin": "2.5rem", "space-xs": "0.25rem", "gutter-mobile": "1rem", "space-sm": "0.5rem", "space-md": "1rem", "space-lg": "1.5rem", "margin-mobile": "1rem", "gutter": "1.5rem", "space-xl": "2.5rem" }, "fontFamily": { "display-hero-mobile": ["Assistant"], "headline-md": ["Assistant"], "body-lg": ["Assistant"], "headline-sm": ["Assistant"], "body-md": ["Assistant"], "badge-sm": ["Assistant"], "headline-lg-mobile": ["Assistant"], "stat-counter": ["Assistant"], "body-bold": ["Assistant"], "label-md": ["Assistant"], "display-hero": ["Assistant"], "headline-lg": ["Assistant"] }, "fontSize": { "display-hero-mobile": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.01em", "fontWeight": "200" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "badge-sm": ["13px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-lg-mobile": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "stat-counter": ["44px", { "lineHeight": "48px", "letterSpacing": "0em", "fontWeight": "200" }], "body-bold": ["16px", { "lineHeight": "24px", "fontWeight": "700" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "display-hero": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "200" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface-container font-body-md text-body-md min-h-screen flex flex-col selection:bg-secondary-container"><header class="fixed top-0 w-full z-50 pt-safe bg-primary-container text-on-primary"><div class="h-20 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><img alt="Hebrew warranty brand mark with clean typography and saffron geometric square accent. Brand logo. - Primary color: #1b2559
- Font: publicSans
- Mode: light
- Roundness: rounded-sm
" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1UJEXB2W0eXcR0uLrjPhebHA-zd-5tQE7o8TlfCucXoJAApxG51kiDBpVGhq64fsFFkRX40wymx9zb4rpIEfXGmmPnkDBsEzISxBrNs9VW_lS4r12n3KQ_iEnVGzPkxtTRnjnzsFdilfx1ZNUeC4Pq3OMNR7tDUkXMEkkxr56WZCnVFgc36sld4UStXq0sgB_sk7Hh-z_mOe4LyT4zEe4lu22OgM4hjsMcH7Tk_uKKhPtxNG3icYrDRwZ8"/><div class="flex flex-col"><span class="font-headline-sm text-headline-sm text-on-primary leading-none">תו אחריות</span><span class="font-label-md text-label-md text-on-primary-container leading-none pt-space-xs">Login</span></div></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div><button aria-label="חזרה" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-primary hover:bg-white/10 active:bg-white/20 transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button></div></div></header><main class="flex-1 flex flex-col relative w-full pt-20 bg-surface-container"><div class="flex flex-col w-full bg-surface-container font-body-md text-on-surface" dir="rtl">
<!-- Sub-page Title and Context Header -->
<div class="px-margin-mobile pt-space-md pb-space-lg flex flex-col gap-space-xs">
<div class="flex items-center gap-space-sm">
<button aria-label="חזרה לדף הקודם" class="w-10 h-10 -mr-2 flex items-center justify-center text-primary active:opacity-70 transition-opacity" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">הצטרפות למרחב</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant pr-8">
      הזינו את הקוד שקיבלתם בהזמנה.
    </p>
</div>
<!-- Main Content Form Section -->
<div class="px-margin-mobile flex flex-col flex-1 pb-space-xl">
<!-- Code Input Grid (6 individual character cells) -->
<div class="flex flex-col gap-space-md my-space-md" id="code-entry-block">
<div class="flex items-center justify-between gap-space-xs" dir="ltr">
<!-- Digit 1 -->
<input aria-label="תו קוד 1" class="w-12 h-14 text-center font-headline-md text-headline-md text-error bg-error-container/30 border border-error rounded-xl focus:outline-none select-none transition-colors" maxlength="1" readonly="" type="text" value="B"/>
<!-- Digit 2 -->
<input aria-label="תו קוד 2" class="w-12 h-14 text-center font-headline-md text-headline-md text-error bg-error-container/30 border border-error rounded-xl focus:outline-none select-none transition-colors" maxlength="1" readonly="" type="text" value="L"/>
<!-- Digit 3 -->
<input aria-label="תו קוד 3" class="w-12 h-14 text-center font-headline-md text-headline-md text-error bg-error-container/30 border border-error rounded-xl focus:outline-none select-none transition-colors" maxlength="1" readonly="" type="text" value="H"/>
<!-- Digit 4 -->
<input aria-label="תו קוד 4" class="w-12 h-14 text-center font-headline-md text-headline-md text-error bg-error-container/30 border border-error rounded-xl focus:outline-none select-none transition-colors" maxlength="1" readonly="" type="text" value="4"/>
<!-- Digit 5 -->
<input aria-label="תו קוד 5" class="w-12 h-14 text-center font-headline-md text-headline-md text-error bg-error-container/30 border border-error rounded-xl focus:outline-none select-none transition-colors" maxlength="1" readonly="" type="text" value="K"/>
<!-- Digit 6 -->
<input aria-label="תו קוד 6" class="w-12 h-14 text-center font-headline-md text-headline-md text-error bg-error-container/30 border border-error rounded-xl focus:outline-none select-none transition-colors" maxlength="1" readonly="" type="text" value="2"/>
</div>
<!-- Error Feedback Message -->
<div aria-live="assertive" class="flex items-start gap-space-xs text-error mt-space-xs" role="alert">
<span class="material-symbols-outlined text-[18px] shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="font-label-md text-label-md leading-snug">
          הקוד לא נכון או שפג תוקפו. בקשו קוד חדש ממי שהזמין אתכם.
        </span>
</div>
</div>
<!-- Reassurance / Context micro-copy -->
<div class="py-space-md flex flex-col gap-space-sm text-on-surface-variant">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-[20px] text-outline">info</span>
<span class="font-body-md text-body-md text-on-surface-variant">קוד ההזמנה תקף ל-24 שעות ממועד שליחתו</span>
</div>
<button class="text-right font-label-md text-label-md text-primary underline underline-offset-4 self-start hover:opacity-80 active:opacity-60 transition-opacity" type="button">
        שלחו לי עזרה בהצטרפות
      </button>
</div>
<!-- Primary Action -->
<div class="mt-auto pt-space-xl flex flex-col gap-space-md">
<button class="w-full h-12 bg-secondary-container text-on-secondary-fixed font-headline-sm text-headline-sm rounded-xl flex items-center justify-center transition-transform active:scale-[0.98] select-none cursor-pointer" id="submit-code-btn" type="button">
        הצטרפות
      </button>
<button class="w-full h-11 bg-transparent text-primary font-body-bold text-body-bold flex items-center justify-center hover:opacity-80 active:opacity-60 transition-opacity" onclick="history.back()" type="button">
        חזרה לדף הקודם
      </button>
</div>
</div>
</div>
<script>
  // Micro-interaction: subtle haptic-like shake on primary attempt
  document.getElementById('submit-code-btn')?.addEventListener('click', () => {
    const block = document.getElementById('code-entry-block');
    if (!block) return;
    block.classList.add('translate-x-1');
    setTimeout(() => {
      block.classList.remove('translate-x-1');
      block.classList.add('-translate-x-1');
      setTimeout(() => {
        block.classList.remove('-translate-x-1');
      }, 70);
    }, 70);
  });
</script></main></body></html>
