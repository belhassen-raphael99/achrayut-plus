<!DOCTYPE html>

<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>S7 — הודעה נשלחה | תו אחריות</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              night: '#1B2559',
              saffron: '#F4B942',
              ink: '#121633',
              porcelain: '#EEF0F6',
              muted: '#4A4F66',
              border: '#D8DAE0',
              inputBg: '#FFFFFF',
            }
          },
          fontFamily: {
            sans: ['Assistant', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Assistant', sans-serif;
      background-color: #EEF0F6;
      color: #121633;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
<!-- SITE HEADER (mobile) -->
<header class="bg-brand-night text-white px-5 py-4 flex items-center justify-between border-b border-[#2B3775]">
<!-- Logo on right (RTL start) -->
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-[2px] bg-brand-saffron inline-block"></span>
<span class="font-bold text-xl tracking-tight text-white">תו אחריות</span>
</div>
<!-- Actions on left (RTL end) -->
<div class="flex items-center gap-3">
<a class="text-sm font-semibold text-white px-3 py-1.5 rounded-lg border border-white/30 hover:bg-white/10 transition-colors" href="#">
        התחברות
      </a>
<button aria-label="תפריט" class="p-1.5 text-white hover:text-brand-saffron focus:outline-none" type="button">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<line x1="3" x2="21" y1="12" y2="12"></line>
<line x1="3" x2="21" y1="6" y2="6"></line>
<line x1="3" x2="21" y1="18" y2="18"></line>
</svg>
</button>
</div>
</header>
<!-- MAIN CONTENT CONTAINER -->
<main class="flex-grow max-w-[390px] w-full mx-auto px-5 py-8"><div class="text-center pt-8 pb-4 flex flex-col items-center">
<!-- Green Check Icon Badge -->
<div class="w-16 h-16 rounded-full bg-[#E8F5E9] flex items-center justify-center mb-6 text-[#1B8354]">
<svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
<!-- Confirmation Title -->
<h1 class="text-[28px] font-bold text-brand-night leading-tight mb-3">
        ההודעה נשלחה
      </h1>
<!-- Confirmation Message -->
<p class="text-base text-brand-muted leading-relaxed max-w-[320px] mb-8">
        קיבלנו את ההודעה ונחזור אליכם אל <span class="font-medium text-brand-ink" dir="ltr">noa@example.com</span> תוך 2 ימי עסקים.
      </p>
<!-- Return to Home link -->
<a class="inline-flex items-center justify-center text-brand-night font-semibold text-base hover:text-brand-saffron hover:underline transition-colors py-2 px-4" href="#">
        חזרה לדף הבית
      </a>
</div></main>
<!-- SITE FOOTER -->
<footer class="bg-brand-ink text-white pt-10 pb-8 px-5 mt-10">
<div class="max-w-[390px] mx-auto flex flex-col items-center text-center">
<!-- Footer Logo -->
<div class="flex items-center justify-center gap-2 mb-6">
<span class="w-3 h-3 rounded-[2px] bg-brand-saffron inline-block"></span>
<span class="font-bold text-xl tracking-tight text-white">תו אחריות</span>
</div>
<!-- Footer Links (Exact specified list) -->
<nav class="flex flex-wrap justify-center gap-x-4 gap-y-3 text-sm text-gray-300 mb-8 max-w-[320px]">
<a class="hover:text-white transition-colors" href="#">תמחור</a>
<a class="hover:text-white transition-colors" href="#">שאלות נפוצות</a>
<a class="hover:text-white transition-colors text-white font-semibold" href="#">יצירת קשר</a>
<a class="hover:text-white transition-colors" href="#">תנאי שימוש</a>
<a class="hover:text-white transition-colors" href="#">מדיניות פרטיות</a>
<a class="hover:text-white transition-colors" href="#">הצהרת נגישות</a>
<a class="hover:text-white transition-colors" href="#">ביטול מנוי</a>
</nav>
<!-- Copyright -->
<div class="text-xs text-brand-muted border-t border-white/10 pt-5 w-full">
        © 2026 תו אחריות. כל הזכויות שמורות.
      </div>
</div>
</footer>
</body>
</html>
