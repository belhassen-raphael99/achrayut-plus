ile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="חזור" class="w-11 h-11 flex items-center justify-center text-primary active:opacity-70" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><div class="flex items-center gap-space-xs mr-1"><img alt="Hebrew warranty brand mark with clean typography and saffron geometric square accent. Brand logo. - Primary color: #1b2559

<div class="w-full max-w-sm flex flex-col items-center">

<div class="relative mb-space-lg">
<div class="w-24 h-32 rounded-xl bg-surface-container-low shadow-sm flex flex-col items-center justify-between p-2.5 overflow-hidden relative">
<!-- Receipt Header Simulation -->
<div class="w-full flex items-center justify-between opacity-40">
<div class="w-6 h-1.5 rounded-full bg-on-surface-variant"></div>
<div class="w-2.5 h-2.5 rounded-full bg-on-surface-variant"></div>
</div>
<!-- Receipt Rows Simulation with blurred out appearance -->
<div class="w-full space-y-1.5 opacity-25">
<div class="w-full h-1 rounded-full bg-on-surface-variant"></div>
<div class="w-4/5 h-1 rounded-full bg-on-surface-variant"></div>
<div class="w-2/3 h-1 rounded-full bg-on-surface-variant"></div>
<div class="w-3/4 h-1 rounded-full bg-on-surface-variant"></div>

<!-- Receipt Total Simulation -->
<div class="w-full pt-1 opacity-30 flex justify-between items-center">
<div class="w-5 h-1.5 rounded-full bg-on-surface"></div>
<div class="w-8 h-2 rounded-full bg-on-surface"></div>
</div>
<!-- Warning Badge Pinned to Thumbnail -->
<div class="absolute -bottom-1 -left-1 w-7 h-7 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container shadow-sm">
<span class="material-symbols-outlined text-[18px]">question_mark</span>
</div>
</div>
</div>
<!-- Alert Icon -->
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-space-md">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'wght' 300;">error_outline</span>
</div>
<!-- Title -->
<h2 class="font-headline-sm text-headline-sm text-primary font-headline-md mb-space-xs tracking-tight">
      לא הצלחנו לקרוא את החשבונית
    </h2>
<!-- Explanatory Text -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto mb-space-xl leading-relaxed">
      התמונה נשמרה. אפשר לצלם שוב באור טוב יותר, או להזין את הפרטים ידנית.
    </p>
<!-- Interactive Helpful Tips Box -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-md mb-space-xl text-right shadow-sm">
<div class="flex items-center gap-space-xs mb-space-xs text-primary">
<span class="material-symbols-outlined text-[20px] text-secondary">lightbulb</span>
<span class="font-label-md text-label-md">טיפים לצילום מוצלח:</span>
</div>
<ul class="text-on-surface-variant font-body-md text-body-md text-sm space-y-1 pr-5 list-disc marker:text-secondary-container">
<li>כדאי להניח את החשבונית על משטח ישר ומואר</li>
<li>מומלץ להימנע מהשתקפויות או צל חזק על הטקסט</li>
</ul>
</div>
<!-- Actions Area -->
<div class="w-full flex flex-col gap-space-sm">
<!-- Primary Saffron Button -->
<button class="w-full h-12 bg-secondary-container text-on-secondary-fixed font-headline-sm text-headline-sm text-[16px] rounded-full flex items-center justify-center gap-space-xs active:scale-[0.98] transition-transform shadow-sm" id="reshoot-btn" type="button">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>

</button>

<span class="material-symbols-outlined text-[20px]">edit_note</span>
<span>הזנה ידנית</span>
</button>
</div>
</div>
</div>
<script>
  document.getElementById('reshoot-btn')?.addEventListener('click', () => {
    // Micro-interaction trigger for retaking the photo
    if (navigator.vibrate) navigator.vibrate(20);
  });

  document.getElementById('manual-btn')?.addEventListener('click', () => {
    // Micro-interaction trigger for manual flow
    if (navigator.vibrate) navigator.vibrate(10);
  });
</script></main></body></html>
