  </head><body class="bg-surface text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-gutter-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="חזור" class="w-11 h-11 flex items-center justify-center text-primary active:opacity-70" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><div class="flex items-center gap-space-xs mr-1"><img alt="Hebrew warranty brand mark with clean typography and saffron geometric square accent. Brand logo. - Primary color: #1b2559
- Font: publicSans
- Mode: light
- Roundness: rounded-sm
" class="h-7 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1UJEXB2W0eXcR0uLrjPhebHA-zd-5tQE7o8TlfCucXoJAApxG51kiDBpVGhq64fsFFkRX40wymx9zb4rpIEfXGmmPnkDBsEzISxBrNs9VW_lS4r12n3KQ_iEnVGzPkxtTRnjnzsFdilfx1ZNUeC4Pq3OMNR7tDUkXMEkkxr56WZCnVFgc36sld4UStXq0sgB_sk7Hh-z_mOe4LyT4zEe4lu22OgM4hjsMcH7Tk_uKKhPtxNG3icYrDRwZ8"/><h1 class="font-headline-sm text-headline-sm text-primary tracking-tight truncate max-w-[180px]">Add Appliance Flow</h1></div></div><div class="flex items-center gap-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full">
<div class="w-full px-gutter-mobile py-space-xl flex flex-col items-center justify-center text-center">
<!-- Hero Illustration / Visual Container -->
<div class="relative w-28 h-28 mb-space-lg flex items-center justify-center">
<!-- Soft tonal circle for depth without borders/shadows -->
<div class="absolute inset-0 bg-surface-container rounded-full scale-100 transition-transform duration-500 ease-out hover:scale-105"></div>
<!-- Base Document Icon -->
<div class="relative z-10 text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<!-- Overlaid Error Indicator Badge -->
<div class="absolute top-1 left-2 z-20 w-8 h-8 rounded-full bg-error-container text-on-error-container flex items-center justify-center transition-transform duration-300 hover:rotate-12">
<span class="material-symbols-outlined text-[20px] font-bold">priority_high</span>
</div>
</div>
<!-- Error Messaging -->
<div class="max-w-xs flex flex-col items-center mb-space-xl">
<h2 class="font-headline-sm text-headline-sm text-primary font-bold mb-space-xs tracking-tight">
        אי אפשר להעלות את הקובץ הזה
      </h2>
<p class="font-body-md text-body-md text-on-surface-variant font-normal">
        אפשר להעלות תמונה או PDF עד 10MB.
      </p>
</div>
<!-- Actions Group -->
<div class="w-full max-w-xs flex flex-col items-stretch gap-space-md">
<!-- Primary Saffron Action -->
<button class="w-full h-12 bg-secondary-container text-on-secondary-container hover:bg-secondary-fixed-dim active:scale-[0.98] transition-all duration-150 rounded-xl font-body-bold text-body-bold flex items-center justify-center gap-space-xs" id="reupload-trigger">
<span class="material-symbols-outlined text-[22px]">upload_file</span>
<span>בחירת קובץ אחר</span>
</button>
<input accept="image/*,.pdf" class="hidden" id="file-selector" type="file"/>
<!-- Subtle Ghost Fallback Link -->
<button class="w-full py-space-sm text-on-surface-variant hover:text-primary active:opacity-70 transition-colors font-body-md text-body-md flex items-center justify-center gap-space-xs group" id="manual-entry-btn">
<span>הזנה ידנית</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-200 group-hover:-translate-x-1">arrow_back</span>
</button>
</div>
<!-- Visual Ledger Helper Bar (Editorial Context Shift) -->
<div class="w-full max-w-sm mt-space-2xl pt-space-xl">
<div class="bg-surface-container-low rounded-xl p-space-md flex items-center gap-space-md text-right">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined text-[22px]">lightbulb</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-primary truncate">טיפ לצילום חשבונית</span>
<span class="font-badge-sm text-badge-sm text-on-surface-variant truncate">תאורה טובה וישרה מאפשרת זיהוי אוטומטי מהיר</span>
</div>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const trigger = document.getElementById('reupload-trigger');
    const fileInput = document.getElementById('file-selector');
    const manualBtn = document.getElementById('manual-entry-btn');

    if (trigger && fileInput) {
      trigger.addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          trigger.classList.add('opacity-75');
          trigger.querySelector('span:last-child').textContent = 'טוען קובץ...';
        }
      });
    }

    if (manualBtn) {
      manualBtn.addEventListener('click', () => {
        manualBtn.classList.add('opacity-50');
      });
    }
  })();
</script></main></body></html>
