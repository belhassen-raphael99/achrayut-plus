<script>
  (function() {
    const retakeBtn = document.getElementById('btn-retake');
    const acceptBtn = document.getElementById('btn-accept');

    if (retakeBtn) {
      retakeBtn.addEventListener('click', () => {
        retakeBtn.classList.add('opacity-70');
        setTimeout(() => retakeBtn.classList.remove('opacity-70'), 150);
      });
    }

    if (acceptBtn) {
      acceptBtn.addEventListener('click', () => {
        acceptBtn.classList.add('opacity-90', 'scale-95');
        setTimeout(() => acceptBtn.classList.remove('opacity-90', 'scale-95'), 180);
      });
    }
