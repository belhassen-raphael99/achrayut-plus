</div>
<div aria-hidden="true" class="w-10 h-10 opacity-0 pointer-events-none"></div>
</div>
</div>
<!-- Main Card Overlapping Container (Offset by 30px using structural margins) -->
<div class="w-full px-margin-mobile -mt-8 pb-space-2xl">
<div class="w-full bg-surface-container-lowest rounded-xl p-space-lg">
<!-- Card Header -->
<div class="flex items-center justify-between mb-space-lg">
<h1 class="font-headline-md text-headline-md text-on-surface">התחברות</h1>
<span class="w-2.5 h-2.5 rounded-full bg-secondary-container" title="אבטחה פעילה"></span>
</div>
<!-- Google Social Login (Disabled State) -->
<div class="w-full flex items-center justify-center gap-space-sm h-12 bg-surface-container-low text-outline rounded-lg opacity-60 cursor-not-allowed select-none mb-space-md">
<svg aria-hidden="true" class="w-5 h-5 grayscale opacity-70" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="currentColor"></path>

</svg>
<span class="font-label-md text-label-md">המשך עם Google</span>
</div>
<!-- Divider Band -->

<div class="w-full h-px bg-surface-variant"></div>
<span class="absolute bg-surface-container-lowest px-space-sm font-label-md text-label-md text-outline">או</span>
</div>
<!-- Form Inputs (Read-only / Disabled) -->
<div class="flex flex-col gap-space-md mb-space-lg">
<!-- Email Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant text-right">אימייל</label>
<div class="w-full h-12 bg-surface-container-low rounded-lg px-space-md flex items-center justify-between text-outline">

<div class="w-9 h-9 rounded-lg bg-secondary-fixed flex items-center justify-center shrink-0">

</div>
<div class="flex flex-col flex-1 min-w-0">
<div class="flex items-center justify-between gap-space-xs">
<h2 class="font-body-bold text-body-bold text-on-surface">יותר מדי ניסיונות התחברות</h2>
<span class="font-badge-sm text-badge-sm bg-secondary-container text-on-secondary-container px-space-xs py-0.5 rounded-sm tabular-nums" id="countdown-badge">04:59</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant mt-space-xs leading-relaxed">
              מטעמי אבטחה, אפשר לנסות שוב בעוד 5 דקות. אפשר גם לאפס את הסיסמה באופן מיידי.
            </p>
</div>
</div>
<!-- Visual Flat Progress Ribbon -->
<div class="w-full bg-surface-variant h-1.5 rounded-full overflow-hidden mt-space-md">
<div class="bg-secondary h-full rounded-full w-full transition-all duration-1000 ease-linear" id="lockout-progress"></div>
</div>
</div>
<!-- Single Primary Call-to-Action -->
<button class="w-full h-12 bg-secondary-container text-on-secondary-container hover:bg-secondary-fixed-dim active:bg-secondary-fixed font-body-bold text-body-bold rounded-lg flex items-center justify-center gap-space-xs transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">lock_reset</span>
<span>איפוס סיסמה</span>
</button>
</div>

<a class="font-body-bold text-body-bold text-primary underline underline-offset-4 hover:text-primary-container transition-colors" href="#">הרשמה</a>
</div>
<!-- Security Micro-Footer -->
<div class="mt-space-xl flex items-center justify-center gap-space-sm text-outline">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-badge-sm text-badge-sm">תו אחריות מאובטח בתקן SSL</span>
</div>
</div>
</div>
<script>
  (function() {
    let totalSeconds = 299;
    const badge = document.getElementById('countdown-badge');
    const progressBar = document.getElementById('lockout-progress');
    const initialSeconds = 300;

    const timer = setInterval(() => {
      if (totalSeconds <= 0) {
        clearInterval(timer);
        if (badge) badge.textContent = '00:00';
        if (progressBar) progressBar.style.width = '0%';
        return;
      }
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      if (badge) badge.textContent = formatted;
      if (progressBar) {
        const percent = (totalSeconds / initialSeconds) * 100;
        progressBar.style.width = percent + '%';
      }
      totalSeconds--;
    }, 1000);
  })();
</script></main></body></html>
